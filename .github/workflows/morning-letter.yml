name: Morning Letter

on:
  workflow_dispatch:
  schedule:
    # GitHub 예약 실행은 이 저장소에서 몇 시간씩 늦게 시작됩니다(실측 3~6시간).
    # 그래서 23:30~04:30 KST에 한 시간마다 걸어 두고, 먼저 시작된 실행이 05:00 KST까지 기다렸다 보냅니다.
    # 14:30~19:30 UTC = 23:30~04:30 KST
    - cron: "30 14-19 * * *"
    # 위 실행이 모두 05:00을 넘겨 시작된 날을 위한 예비. 21:00 UTC = 06:00 KST
    - cron: "0 21 * * *"

permissions:
  contents: read
  actions: read

# 예약 실행은 한 번에 하나만 돕니다. 05:00까지 기다리는 실행 뒤에 온 실행은 대기했다가, 이미 보낸 것을 보고 건너뜁니다.
# 수동 실행은 이 줄에 묶이지 않고 바로 보냅니다.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'morning-letter-schedule' || format('manual-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  send-morning-letter:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Plan send time
        id: plan
        if: github.event_name == 'schedule'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date +%s)
          hour=$((10#$(TZ=KST-9 date +%H)))
          if [ "$hour" -ge 18 ]; then
            target_date=$(TZ=KST-9 date -d tomorrow +%F)
          else
            target_date=$(TZ=KST-9 date +%F)
          fi
          target=$(date -d "$target_date 05:00 +0900" +%s)
          wait=$((target - now))

          # 작업 최대 실행 시간(6시간) 안에 05:00에 닿지 못하면, 더 늦게 오는 예약 실행에 맡깁니다.
          if [ "$wait" -gt 20000 ]; then
            echo "05:00 KST까지 ${wait}초 남아 이번 실행은 건너뜁니다."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$wait" -le 0 ]; then
            since=$(date -u -d "$target_date 04:50 +0900" +%Y-%m-%dT%H:%M:%SZ)
            sent=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/morning-letter.yml/runs?status=success&per_page=30" \
              || echo '{"workflow_runs":[]}')
            count=$(echo "$sent" | jq --arg since "$since" '[.workflow_runs[] | select(.updated_at >= $since)] | length')
            if [ "${count:-0}" -gt 0 ]; then
              echo "${target_date} 편지는 이미 보냈습니다."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.plan.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Set up Java 21
        if: steps.plan.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate mail secrets
        if: steps.plan.outputs.skip != 'true'
        env:
          NAVER_MAIL_USERNAME: ${{ secrets.NAVER_MAIL_USERNAME }}
          NAVER_MAIL_PASSWORD: ${{ secrets.NAVER_MAIL_PASSWORD }}
        run: |
          if [ -z "$NAVER_MAIL_USERNAME" ] || [ -z "$NAVER_MAIL_PASSWORD" ]; then
            echo "::error::GitHub Secrets에 NAVER_MAIL_USERNAME, NAVER_MAIL_PASSWORD를 설정하세요."
            exit 1
          fi

      - name: Build
        if: steps.plan.outputs.skip != 'true'
        run: |
          chmod +x gradlew
          ./gradlew bootJar -x test --no-daemon

      - name: Wait until 05:00 KST
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.target != ''
        env:
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          wait=$((TARGET - $(date +%s)))
          if [ "$wait" -gt 0 ]; then
            echo "05:00 KST까지 ${wait}초 대기"
            sleep "$wait"
          fi

      - name: Send morning letter
        if: steps.plan.outputs.skip != 'true'
        env:
          SPRING_PROFILES_ACTIVE: actions
          NAVER_MAIL_USERNAME: ${{ secrets.NAVER_MAIL_USERNAME }}
          NAVER_MAIL_PASSWORD: ${{ secrets.NAVER_MAIL_PASSWORD }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LETTER_RECIPIENT: ${{ secrets.LETTER_RECIPIENT }}
        run: java -jar build/libs/*-SNAPSHOT.jar --spring.profiles.active=actions
